<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="zap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="cal-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Inner Calendar Board -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="96" y="112" width="320" height="304" rx="36" fill="#ffffff" />
    
    <!-- Calendar Top Header -->
    <path d="M 96 148 C 96 128.1 112.1 112 132 112 L 380 112 C 399.9 112 416 128.1 416 148 L 416 184 L 96 184 Z" fill="url(#cal-header)" />
    
    <!-- Binder Rings -->
    <rect x="156" y="88" width="20" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="3" />
    <rect x="336" y="88" width="20" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="3" />

    <!-- Calendar Grid Slots -->
    <rect x="136" y="214" width="64" height="48" rx="10" fill="#eff6ff" />
    <rect x="224" y="214" width="64" height="48" rx="10" fill="#eff6ff" />
    <rect x="312" y="214" width="64" height="48" rx="10" fill="#fef3c7" />

    <rect x="136" y="284" width="64" height="48" rx="10" fill="#f0fdf4" />
    <rect x="224" y="284" width="64" height="48" rx="10" fill="#eff6ff" />
    <rect x="312" y="284" width="64" height="48" rx="10" fill="#eff6ff" />

    <rect x="136" y="354" width="64" height="34" rx="10" fill="#f8fafc" />
    <rect x="224" y="354" width="64" height="34" rx="10" fill="#f8fafc" />
    <rect x="312" y="354" width="64" height="34" rx="10" fill="#f8fafc" />
  </g>

  <!-- Glowing Smart Lightning Badge in bottom-right corner -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="360" r="68" fill="#1e293b" stroke="#ffffff" stroke-width="6" />
    <path d="M 368 308 L 332 358 L 358 358 L 348 412 L 392 352 L 364 352 Z" fill="url(#zap-grad)" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
